<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelley West — coming soon</title>
<meta name="description" content="Kelley West. Coming soon.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<style>
  :root { --paper:#ffffff; --ink:#191919; --mid:#595959; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center;
    background:var(--paper); color:var(--ink); padding:48px 20px; }
  main { text-align:center; }
  img { display:block; width:min(260px, 62vw); height:auto; margin:0 auto 2.4rem; filter:grayscale(1); }
  h1 { font:400 clamp(2.4rem, 7vw, 3.6rem)/1.05 'Libre Caslon Display', Georgia, 'Times New Roman', serif;
    letter-spacing:-0.01em; margin:0; }
  p { font:400 13px/1.4 Archivo, Helvetica, Arial, sans-serif; letter-spacing:.3em;
    text-transform:lowercase; color:var(--mid); margin:1.1rem 0 0; }
  ::selection { background:var(--ink); color:var(--paper); }
</style>
</head>
<body>
<main>
  <img src="images/kelley-640.jpg" alt="Kelley West, smiling, in black and white" width="640" height="960">
  <h1>Kelley West</h1>
  <p>coming soon</p>
</main>
</body>
</html>
